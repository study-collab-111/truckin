<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#121212" />
  <!-- Technical Design Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>
  <!-- Stylized cargo truck combined with 'T' logo design -->
  <g transform="translate(64, 64)">
    <!-- Cargo Box container in theme green -->
    <path d="M30 220 L230 220 L230 90 L120 90 L30 170 Z" fill="#C5FF00" />
    <!-- Cab structure in contrasting white -->
    <path d="M230 90 L310 90 L310 220 L230 220 Z" fill="#FFFFFF" />
    <!-- Box vertical textures -->
    <rect x="50" y="110" width="25" height="90" fill="#121212" opacity="0.3" />
    <rect x="100" y="110" width="25" height="90" fill="#121212" opacity="0.3" />
    <rect x="150" y="110" width="25" height="90" fill="#121212" opacity="0.3" />
    <!-- Cab Window -->
    <path d="M250 110 L290 110 L290 150 L250 150 Z" fill="#121212" />
    <!-- Heavy-duty wheels -->
    <circle cx="90" cy="240" r="32" fill="#121212" stroke="#C5FF00" stroke-width="8" />
    <circle cx="90" cy="240" r="10" fill="#FFFFFF" />
    
    <circle cx="270" cy="240" r="32" fill="#121212" stroke="#FFFFFF" stroke-width="8" />
    <circle cx="270" cy="240" r="10" fill="#C5FF00" />
    
    <!-- Letter T with speed lines overlay -->
    <path d="M120 30 L280 30 L280 60 L215 60 L215 150 L185 150 L185 60 L120 60 Z" fill="#C5FF00" />
  </g>
</svg>
